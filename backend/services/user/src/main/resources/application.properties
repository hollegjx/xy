spring.application.name=xy-user
server.address=127.0.0.1
server.port=8124
server.servlet.context-path=/api
spring.session.redis.namespace=xy:session
spring.data.redis.client-type=jedis
spring.data.redis.jedis.pool.enabled=true
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
mybatis-flex.configuration.map-underscore-to-camel-case=false
dubbo.application.name=xy-user
dubbo.application.qos-enable=false
dubbo.registry.address=N/A
dubbo.protocol.name=tri
# 使用 IPv4 回环；不把用户身份查询端口开放到网卡。
dubbo.protocol.host=::ffff:127.0.0.1
dubbo.protocol.port=50051
