name: XY Higress gateway
on:
  push:
    paths:
      - 'ops/gateway/**'
      - '.github/workflows/higress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Route through real Higress and Nacos
        env:
          XY_TEST_HIGRESS: '1'
        run: python3 -Bu ops/gateway/test_higress.py -v
