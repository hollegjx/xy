# 放入已有 Nginx 的 http 配置块，分别替换发布目录和随仓库提供的 .inc 的绝对路径。
# 这是本机验收示例：平台使用 localhost，作品使用 127.0.0.1，不能仅更换端口。
server {
    listen 127.0.0.1:8102 default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:8102;
    server_name 127.0.0.1;
    root /ABSOLUTE/PATH/TO/xy/backend/published;
    include /ABSOLUTE/PATH/TO/xy/backend/nginx-published.inc;
}
