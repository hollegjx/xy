name: xy-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    # Linux 上与 XY 共用宿主机回环，直接复用已有的 8103 抓取配置。
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:${XY_PROMETHEUS_PORT:-9090}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - measurements:/prometheus

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${XY_GRAFANA_PORT:-3000}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      XY_PROMETHEUS_URL: http://127.0.0.1:${XY_PROMETHEUS_PORT:-9090}
    secrets: [grafana-password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/xy.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/xy.yml:ro
      - ./xy-ai-dashboard.json:/etc/xy/dashboards/xy-ai.json:ro

volumes:
  measurements:
  grafana-data:
secrets:
  grafana-password: {environment: XY_MONITORING_ADMIN_PASSWORD}
