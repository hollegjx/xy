spring.application.name=xy-screenshot
spring.main.web-application-type=none
dubbo.application.name=xy-screenshot
dubbo.application.qos-enable=false
dubbo.registry.address=N/A
dubbo.protocol.name=tri
# JDK 将此字面量解析为 IPv4 127.0.0.1。Dubbo 会把直接填写的 127.0.0.1 改成自动选址。
dubbo.protocol.host=::ffff:127.0.0.1
dubbo.protocol.port=50052
