server:
  port: 8101
  servlet:
    context-path: /api

spring:
  application:
    name: xy-backend
  cache:
    type: redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # 若启用 Redis 认证，请仅在本机 application.yml 填写 username / password。
      connect-timeout: 1s
      timeout: 1s
  session:
    redis:
      namespace: xy:session
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xy?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: CHANGE_ME
    hikari:
      connection-timeout: 5000

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

springdoc:
  packages-to-scan: com.xy

xy:
  ai:
    enabled: false
    base-url: https://YOUR_MODEL_GATEWAY/v1
    api-key: CHANGE_ME
    model-name: gpt-6.1-sol
    # 可填同一网关支持的轻量模型，仅用于创建应用时的「自动选择」；留空沿用 model-name。
    routing-model-name: ''
    # Vue 工程生成、续改及其质检可单独使用支持流式工具调用的模型。留空沿用 model-name。
    vue-model-name: ''
    # 可按模型单独设置 Vue 的输出上限；不设置则继承 max-completion-tokens。
    # vue-max-completion-tokens: 32768
    timeout-seconds: 180
    max-tool-rounds: 40
    # 原生网站生成可选：回复为空或过短时要求模型重写一次；打开后正文在检查通过后显示。
    native-output-guardrail: false
    # 仅当普通和 Vue 模型的网关均支持严格 JSON Schema 时打开；只对结构化质检报告发送 schema。
    quality-json-schema: false
    max-completion-tokens: 16384
  generation:
    output-directory: ./generated
  artwork:
    # 已有的自托管 Kroki 根地址；只向该服务发送图的节点与关系。
    kroki-url: ''
    # 配置已有的百炼账号后，可改成 dashscope；只在需求确实需要 Logo 时调用。
    logo-provider: local
    dashscope-model: wanx2.1-t2i-turbo
    dashscope-api-key: ''
  vue-build:
    enabled: false
    docker-executable: docker
    image: xy-vue-builder:local
    timeout-seconds: 120
  cover:
    # 使用已有私有 COS 存储桶时设为 cos，凭证只填本地配置。
    storage: local
    cos:
      region: ''
      bucket: ''
      secret-id: ''
      secret-key: ''
    # 先准备本机隔离截图镜像 xy-cover:1；不启用时作品仍可发布。
    enabled: false
    # 开启封面后，留空沿用本机渲染；连接独立截图服务时填 tri://[::1]:50052。
    rpc-url: ''
  deployment:
    directory: ./published
    # 静态站点实际运行后填写，例如 http://127.0.0.1:8102；空值禁用发布。
    public-url: ''
    # 用户访问平台时的来源；不要只换端口复用同一主机名。
    platform-origin: http://localhost:5173
